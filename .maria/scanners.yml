version: 1
repository:
  provider: github
  id: "f427f613-de06-43f6-aec0-a8dfe7b227a5"
  default_branch: "main"
scanners:
  semgrep:
    enabled: true
    name: "Semgrep CE"
    category: "sast"
    version: "1.162.0"
    output: "sarif"
  gitleaks:
    enabled: true
    name: "Gitleaks"
    category: "secrets"
    version: "8.30.1"
    output: "sarif"
  osv-scanner:
    enabled: true
    name: "OSV-Scanner"
    category: "sca"
    version: "2.3.8"
    output: "sarif"
  dependency-check:
    enabled: false
    name: "OWASP Dependency-Check"
    category: "sca"
    version: "12.2.2"
    output: "sarif"
  trivy-container:
    enabled: true
    name: "Trivy"
    category: "container"
    version: "0.70.0"
    output: "sarif"
  kics:
    enabled: true
    name: "KICS"
    category: "iac"
    version: "2.1.20"
    output: "sarif"
  zap-baseline:
    enabled: true
    name: "OWASP ZAP"
    category: "dast"
    version: "2.17.0"
    output: "json"
upload:
  endpoint: "${MARIA_API_URL}/api/open-scan-pack"
  sarif_contract: "existing-maria-sarif-worker"
